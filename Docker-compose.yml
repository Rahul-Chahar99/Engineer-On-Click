version: '3.8'
services:
  backend:
    image: 290993051085.dkr.ecr.us-east-1.amazonaws.com/backend:latest
    container_name: eoc_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    image: 290993051085.dkr.ecr.us-east-1.amazonaws.com/frontend:latest
    container_name: eoc_frontend
    restart: always
    ports:
      - "80:80" # Map HTTP port 80 of the host to port 80 of the Nginx container
    depends_on:
      - backend


      #done